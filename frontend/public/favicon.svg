<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Glowing effect (optional, maybe too complex for tiny icon, sticking to flat) -->
  <polygon points="50,15 90,85 10,85" fill="#121212" stroke="#e0e0e0" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Capstone separator -->
  <line x1="33" y1="45" x2="67" y2="45" stroke="#e0e0e0" stroke-width="8"/>
  
  <!-- The All-Seeing Eye inside capstone -->
  <path d="M 38,30 Q 50,20 62,30 Q 50,40 38,30" fill="none" stroke="#e0e0e0" stroke-width="4"/>
  
  <!-- Pupil -->
  <circle cx="50" cy="30" r="3" fill="#e0e0e0"/>
  
  <!-- Mystical rays -->
  <line x1="50" y1="5" x2="50" y2="0" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="10" x2="25" y2="5" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="10" x2="75" y2="5" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>
</svg>